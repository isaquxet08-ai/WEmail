name: 编译并发布 WEmail 应用
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取主项目源码
      uses: actions/checkout@v4

    - name: 2. 提取私有签名仓库文件
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.PAT_TOKEN }}
        path: keystore

    - name: 3. 配置 Java 环境 (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle 构建工具
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
        cache-disabled: true

    - name: 5. 执行编译打包
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # 🚨 核心修复：加上 --stacktrace 和 --info，把所有错误全吐出来
      run: gradle assembleRelease --stacktrace --info
