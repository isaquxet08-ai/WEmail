name: 编译并发布 WEmail 应用
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # 🚨 必须要有这个权限才能发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取主项目源码
      uses: actions/checkout@v4

    - name: 2. 提取私有签名仓库文件
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.PAT_TOKEN }}
        path: keystore

    - name: 3. 配置 Java 环境 (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. 配置 Gradle 构建工具
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
        cache-disabled: true

    - name: 5. 执行编译打包 (日志降噪版)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if ! gradle assembleRelease --console=plain > build.log 2>&1; then
          echo "=================================================="
          echo "❌ 编译失败！以下是过滤后的核心报错信息："
          echo "=================================================="
          grep -E -A 10 -B 2 "What went wrong|e: |error:|FAILURE:" build.log || tail -n 30 build.log
          exit 1
        else
          echo "✅ 编译成功！没有发现任何错误。"
        fi

    # 🚨 换回 Release 发布，并自动打上版本号
    - name: 6. 发布到发行版 (Releases)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: WEmail v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/*.apk
